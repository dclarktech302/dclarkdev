name: Create S3 Bucket

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  creating_bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        env: 
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: | 
          terraform plan \
            -var="bucket_name=$BUCKET_NAME"
        working-directory: terraform

      - name: Terraform Apply
        env: 
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform apply -auto-approve
        working-directory: terraform  

      - name: Uploading Files to S3 Bucket
        run: | 
          aws s3 cp index.html s3://${{ secrets.BUCKET_NAME }}/index.html
          aws s3 cp script.js s3://${{ secrets.BUCKET_NAME }}/script.js
          aws s3 cp site.webmanifest s3://${{ secrets.BUCKET_NAME }}/site.webmanifest
          aws s3 cp --recursive styles/ s3://${{ secrets.BUCKET_NAME }}/styles/
          aws s3 cp --recursive logos/ s3://${{ secrets.BUCKET_NAME }}/logos/

      # - name: Sync to S3
